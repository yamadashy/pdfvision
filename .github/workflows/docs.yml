name: CI Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'scripts/build-cli-topics.mjs'
      - 'scripts/build-site-reference.mjs'
      - 'scripts/check-reference-translations.mjs'
      - 'scripts/site-reference.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.tool-versions'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
      - 'scripts/build-cli-topics.mjs'
      - 'scripts/build-site-reference.mjs'
      - 'scripts/check-reference-translations.mjs'
      - 'scripts/site-reference.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.tool-versions'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  topics:
    name: Generated docs in sync with docs/cli-topics
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: npm
      - run: npm ci
      # The generated modules are committed, and ci.yml ignores Markdown-only
      # pushes, so this workflow is what catches a topic edited without
      # regenerating.
      - run: node scripts/build-cli-topics.mjs
      - run: git diff --exit-code src/cli/docs
      # The same topics generate the English site reference. A hand-edited page
      # under docs/src/en/guide shows up here as a diff.
      - run: node scripts/build-site-reference.mjs
      - run: git diff --exit-code docs/src/en
      # Translations cannot be regenerated, so they carry the hash of the
      # English page they were made from; this is what catches a topic edit
      # that left ja/zh-cn/zh-tw describing the old behaviour.
      - run: node scripts/check-reference-translations.mjs

  build:
    name: Build VitePress site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: npm
      - run: npm ci
      - run: npm run docs:build
        env:
          PDFVISION_DOCS_BASE: /
          PDFVISION_DOCS_URL: https://pdfvision.dev
